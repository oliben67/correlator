[project]
name = "sump-plugin-ssh"
version = "0.2.1"
description = "correlator Sump plugin: SSH/local data-stream transport (cor-CORE.DATASTREAM-002)"
requires-python = ">=3.12"
dependencies = [
    "correlator-sump",
    "paramiko>=3.5",
]

[project.entry-points."sump.plugins"]
ssh = "sump_plugin_ssh.plugin:plugin"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "ty>=0.0.71",
]

[tool.uv.sources]
correlator-sump = { path = "../server", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sump_plugin_ssh"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ty.environment]
python-version = "3.12"
