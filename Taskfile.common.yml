# Common Taskfile — deployed asset, not hand-edited per project.
#
# Copy this file to the target project's root as `Taskfile.common.yml`,
# once per project (including this framework's own self-deployment), and
# refresh it from here on `/sync-framework`. See `INSTANTIATION-GUIDE.md`
# §1 step 5, `INSTANTIATION-CHECKLIST.md`'s Discoverability section, and
# `SYNCHRONIZE.md` §6 — this template exists because those require it,
# the same way `templates/slash-command.template.md` backs
# `.claude/commands/*.md`.
#
# One task per command in the deployed `CODE-OF-CONDUCT.md` §4 (the
# canonical list — `scripts/check_command_parity.py` diffs this file
# against it, same drift check already applied to `.claude/commands/`).
# Each task is a thin, non-interactive dispatch to the actual slash
# command via `claude -p`, so day-to-day catalyst operations are
# scriptable from a shell or CI job without an interactive session.
#
# Usage: task <command-name> -- <arguments>
#   e.g. task create-bug -- "flaky test in checkout flow"
#        task user-add -- olivier admin
#
# The project's own root Taskfile.yml should `includes: common:
# ./Taskfile.common.yml` and add its project-specific tasks alongside
# these.

version: "3"

vars:
  CLAUDE: '{{.CLAUDE_BIN | default "claude"}}'

tasks:
  create-bug:
    desc: "Create a new bug artifact and register it in bugs/bugs.md"
    cmds:
      - '{{.CLAUDE}} -p "/create-bug {{.CLI_ARGS}}"'

  create-req:
    desc: "Create a new requirement artifact and register it in requirements/requirements.md"
    cmds:
      - '{{.CLAUDE}} -p "/create-req {{.CLI_ARGS}}"'

  create-requirement:
    desc: "Alias of create-req"
    cmds:
      - '{{.CLAUDE}} -p "/create-requirement {{.CLI_ARGS}}"'

  create-feature:
    desc: "Create a new feature entry in features/features.md (not rule-linked)"
    cmds:
      - '{{.CLAUDE}} -p "/create-feature {{.CLI_ARGS}}"'

  roadmap-add:
    desc: "Ingest a new named roadmap from a local file: <name> <file>"
    cmds:
      - '{{.CLAUDE}} -p "/roadmap-add {{.CLI_ARGS}}"'

  roadmap-remove:
    desc: "Delete or retire a named roadmap: <name>"
    cmds:
      - '{{.CLAUDE}} -p "/roadmap-remove {{.CLI_ARGS}}"'

  roadmap-update:
    desc: "Re-ingest a file as the new full, authoritative roadmap version: <name> <file>"
    cmds:
      - '{{.CLAUDE}} -p "/roadmap-update {{.CLI_ARGS}}"'

  roadmap-merge:
    desc: "Fold a partial delta file into an existing roadmap: <name> <update file>"
    cmds:
      - '{{.CLAUDE}} -p "/roadmap-merge {{.CLI_ARGS}}"'

  user-add:
    desc: "Register a new user: <name> <role>"
    cmds:
      - '{{.CLAUDE}} -p "/user-add {{.CLI_ARGS}}"'

  user-remove:
    desc: "Deactivate a user: <name>"
    cmds:
      - '{{.CLAUDE}} -p "/user-remove {{.CLI_ARGS}}"'

  user-modify:
    desc: "Edit a user's notes or active field: <name> <field> <value>"
    cmds:
      - '{{.CLAUDE}} -p "/user-modify {{.CLI_ARGS}}"'

  user-assign-role:
    desc: "Add a role to an existing user: <name> <role>"
    cmds:
      - '{{.CLAUDE}} -p "/user-assign-role {{.CLI_ARGS}}"'

  user-list:
    desc: "List registered users [--role <role>] [--active-only]"
    cmds:
      - '{{.CLAUDE}} -p "/user-list {{.CLI_ARGS}}"'

  role-add:
    desc: "Add a new role: <role> <actions>"
    cmds:
      - '{{.CLAUDE}} -p "/role-add {{.CLI_ARGS}}"'

  role-modify:
    desc: "Replace an existing role's actions: <role> <actions>"
    cmds:
      - '{{.CLAUDE}} -p "/role-modify {{.CLI_ARGS}}"'

  meta-tag:
    desc: "Create a meta-tag artifact linked to an artifact: <artifact-id>"
    cmds:
      - '{{.CLAUDE}} -p "/meta-tag {{.CLI_ARGS}}"'

  list:
    desc: "List artifacts, work items, rules, or templates: <type> [--filter ...]"
    cmds:
      - '{{.CLAUDE}} -p "/list {{.CLI_ARGS}}"'

  freeze:
    desc: "Protect an item from /sync-framework: <item-id|item-path|type|template-name>"
    cmds:
      - '{{.CLAUDE}} -p "/freeze {{.CLI_ARGS}}"'

  catalyzer:
    desc: "Manage plugin installation/activation: <list|activate|download|deactivate|upgrade|downgrade> ..."
    cmds:
      - '{{.CLAUDE}} -p "/catalyzer {{.CLI_ARGS}}"'

  criterion:
    desc: "Bootstrap/join/sync a repoed .criterion/ deployment: <create|get|push> ..."
    cmds:
      - '{{.CLAUDE}} -p "/criterion {{.CLI_ARGS}}"'

  reconcile:
    desc: "Resolve an open reconciliation case: <RECON-id> <accept|accept-with-edits|reject>"
    cmds:
      - '{{.CLAUDE}} -p "/reconcile {{.CLI_ARGS}}"'

  project:
    desc: "Manage a catalyst deployment: <create|remove|export|import> ..."
    cmds:
      - '{{.CLAUDE}} -p "/project {{.CLI_ARGS}}"'

  status:
    desc: "Update an artifact or work item's Status field"
    cmds:
      - '{{.CLAUDE}} -p "/status {{.CLI_ARGS}}"'

  audit:
    desc: "Analyze the change-impact of a file: <file-name>"
    cmds:
      - '{{.CLAUDE}} -p "/audit {{.CLI_ARGS}}"'

  run-analysis:
    desc: "Open and execute the analysis playbook"
    cmds:
      - '{{.CLAUDE}} -p "/run-analysis {{.CLI_ARGS}}"'

  sync-framework:
    desc: "Synchronize the deployed framework: [latest|<version>]"
    cmds:
      - '{{.CLAUDE}} -p "/sync-framework {{.CLI_ARGS}}"'

  check-rules:
    desc: "Verify rules, domains, and artifact links remain consistent"
    cmds:
      - '{{.CLAUDE}} -p "/check-rules {{.CLI_ARGS}}"'

  commands:
    desc: "List every slash command available in this deployment"
    cmds:
      - '{{.CLAUDE}} -p "/commands {{.CLI_ARGS}}"'

  show-backlog:
    desc: "Summarize open work/blockers and refresh BACKLOG.md and roadmaps"
    cmds:
      - '{{.CLAUDE}} -p "/show-backlog {{.CLI_ARGS}}"'

  journal:
    desc: "Read-only filter/report over development/journal.jsonl"
    cmds:
      - '{{.CLAUDE}} -p "/journal {{.CLI_ARGS}}"'

  journal-restore:
    desc: "Reconstruct the tree as it stood at a timestamp into a side directory"
    cmds:
      - '{{.CLAUDE}} -p "/journal-restore {{.CLI_ARGS}}"'

  help:
    desc: "Return help documentation for the framework or a specific command"
    cmds:
      - '{{.CLAUDE}} -p "/help {{.CLI_ARGS}}"'
