[project]
name = "correlator-sump"
version = "0.2.0"
description = "correlator's Sump: containerized telemetry/log correlation server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pluggy>=1.6.0",
    "redis>=5.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "fakeredis>=2.26",
    "ruff>=0.7",
    "ty>=0.0.71",
    "sump-plugin-ssh",
    "sump-plugin-logstream",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/correlator_sump"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ty.environment]
python-version = "3.12"

[tool.uv.sources]
sump-plugin-ssh = { path = "../sump-plugin-ssh", editable = true }
sump-plugin-logstream = { path = "../sump-plugin-logstream", editable = true }
