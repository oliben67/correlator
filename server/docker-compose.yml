# Single container unit bundling correlator-sump, redis, and fluent-bit

services:
  correlator-sump:
    build: .
    image: ${CORRELATOR_IMAGE:-correlator-sump:latest}
    ports:
      - "${CORRELATOR_PORT:-8765}:8765"
      - "${REDIS_PORT:-6379}:6379"
      - "${FLUENT_PORT:-5140}:5140"
    environment:
      - CORRELATOR_API_TOKEN=${CORRELATOR_API_TOKEN:-}
      - REDIS_URL=${REDIS_URL:-redis://127.0.0.1:6379/0}
