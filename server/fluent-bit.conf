# Fluent Bit config for the Sump's log ingestion pipeline
# (cor-CORE.INGEST-001, REQ-000003 Requirement 1's resolved design).
#
# Input side is unchanged in shape from cttc's Fluentd config: the same
# tcp listener + json parser for the AsynchronousLogstashHandler
# newline-delimited-JSON envelope. Output side uses Fluent Bit's official
# `tcp` output with `raw_message_key` so the original record string is
# forwarded byte-for-byte, no envelope, no added timestamp, to this
# project's own adapter (correlator_sump.ingest.run_ingest_server),
# which performs the actual `RPUSH logsump:ingest:v1 <raw string>`.
#
# Neither a nonexistent Fluent Bit built-in Redis output, nor Fluent
# Bit's still-experimental custom-output-plugin interface, is used here
# -- see REQ-000003's Design/implementation plan for why.

[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name         tcp
    Listen       0.0.0.0
    Port         5140
    Format       json
    Tag          sump.ingest

[OUTPUT]
    Name             tcp
    Match            sump.ingest
    Host             127.0.0.1
    Port             5170
    Format           raw
    raw_message_key  message
